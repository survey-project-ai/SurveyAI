spring:
  application:
    name: survey-ai-platform

  datasource:
    url: jdbc:postgresql://localhost:5432/survey_ai
    username: survey_ai_user
    password: survey_ai_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  task:
    scheduling:
      pool:
        # Call dispatch and status reconciliation run on separate threads.
        size: 2

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

surveyai:
  web:
    allowed-origins: ${SURVEYAI_WEB_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
    # Credentialed CORS: list exact frontend origins. A wildcard on a shared host such as
    # *.up.railway.app would let any site deployed there call the API as the signed-in user.
    allowed-origin-patterns: ${SURVEYAI_WEB_ALLOWED_ORIGIN_PATTERNS:}
  auth:
    cookie:
      secure: ${SURVEYAI_AUTH_COOKIE_SECURE:false}
      same-site: ${SURVEYAI_AUTH_COOKIE_SAME_SITE:Lax}
      domain: ${SURVEYAI_AUTH_COOKIE_DOMAIN:}
  seed:
    enabled: ${SURVEYAI_SEED_ENABLED:true}
    company-slug: ${SURVEYAI_SEED_COMPANY_SLUG:acme-research}
    company-name: ${SURVEYAI_SEED_COMPANY_NAME:Acme Research}
    owner-email: ${SURVEYAI_SEED_OWNER_EMAIL:owner@acme-research.test}
    owner-password: ${SURVEYAI_SEED_OWNER_PASSWORD:change-me-123}
  dev:
    provider-result-simulator-enabled: false
    allow-duplicate-operation-contact-phone-numbers: ${SURVEYAI_DEV_ALLOW_DUPLICATE_OPERATION_CONTACT_PHONE_NUMBERS:false}
  calling:
    queue:
      scheduler-enabled: ${SURVEYAI_CALLING_QUEUE_SCHEDULER_ENABLED:true}
      dispatch-interval-ms: ${SURVEYAI_CALLING_QUEUE_DISPATCH_INTERVAL_MS:15000}
      max-concurrent-calls-per-operation: ${SURVEYAI_CALLING_MAX_CONCURRENT_CALLS_PER_OPERATION:1}
      # Wait before calling again after no answer, busy or voicemail (up to the job's max attempts).
      retry-delay: ${SURVEYAI_CALLING_RETRY_DELAY:2h}
      # Wait before trying again when the provider could not take the call (rate limit, outage).
      dispatch-retry-delay: ${SURVEYAI_CALLING_DISPATCH_RETRY_DELAY:5m}
      # A call with no status update for this long is failed so it no longer blocks the operation.
      stale-active-call-after: ${SURVEYAI_CALLING_STALE_ACTIVE_CALL_AFTER:1h}
      # New calls start only inside this window, in the company's timezone. A company can override
      # it with a "callingHours" object in its metadata_json.
      calling-hours:
        start: ${SURVEYAI_CALLING_HOURS_START:10:00}
        end: ${SURVEYAI_CALLING_HOURS_END:20:00}
        days: ${SURVEYAI_CALLING_DAYS:MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY,SATURDAY,SUNDAY}
        default-timezone: ${SURVEYAI_CALLING_DEFAULT_TIMEZONE:Europe/Istanbul}
    active-provider: ${SURVEYAI_CALLING_ACTIVE_PROVIDER:MOCK}
    mock:
      enabled: ${SURVEYAI_CALLING_MOCK_ENABLED:true}
      base-url: mock://local
    elevenlabs:
      enabled: ${SURVEYAI_CALLING_ELEVENLABS_ENABLED:false}
      mode: ${ELEVENLABS_MODE:LIVE}
      base-url: ${ELEVENLABS_BASE_URL:https://api.elevenlabs.io}
      api-key: ${ELEVENLABS_API_KEY:}
      agent-id: ${ELEVENLABS_AGENT_ID:}
      phone-number-id: ${ELEVENLABS_PHONE_NUMBER_ID:}
      webhook-secret: ${ELEVENLABS_WEBHOOK_SECRET:}
      sandbox-mode: ${ELEVENLABS_SANDBOX_MODE:false}
      webhook-timestamp-tolerance-seconds: 300
      settings:
        call-recording-enabled: ${ELEVENLABS_CALL_RECORDING_ENABLED:false}
        public-webhook-base-url: ${PUBLIC_WEBHOOK_BASE_URL:}
        tool-api-secret: ${ELEVENLABS_TOOL_API_SECRET:${ELEVENLABS_WEBHOOK_SECRET:}}
        agent-prompt-override-enabled: ${ELEVENLABS_AGENT_PROMPT_OVERRIDE_ENABLED:true}
        agent-first-message-override-enabled: ${ELEVENLABS_AGENT_FIRST_MESSAGE_OVERRIDE_ENABLED:true}
        agent-language-override-enabled: ${ELEVENLABS_AGENT_LANGUAGE_OVERRIDE_ENABLED:true}
        agent-asr-keywords-override-enabled: ${ELEVENLABS_AGENT_ASR_KEYWORDS_OVERRIDE_ENABLED:true}
        # LLM for each call (for example claude-haiku-5-5). Empty keeps the model stored on the agent.
        agent-llm: ${ELEVENLABS_AGENT_LLM:}
        asr-quality: ${ELEVENLABS_ASR_QUALITY:high}
        turn-detection-timeout-seconds: ${ELEVENLABS_TURN_DETECTION_TIMEOUT_SECONDS:}
        turn-detection-eagerness: ${ELEVENLABS_TURN_DETECTION_EAGERNESS:normal}
        turn-detection-speculative-turn: ${ELEVENLABS_TURN_DETECTION_SPECULATIVE_TURN:false}
        background-voice-detection-enabled: ${ELEVENLABS_BACKGROUND_VOICE_DETECTION_ENABLED:false}
        status-reconciliation-grace-seconds: ${ELEVENLABS_STATUS_RECONCILIATION_GRACE_SECONDS:20}

logging:
  level:
    org.flywaydb: info
