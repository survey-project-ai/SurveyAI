[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Anchored to the repository root: voice-agent/ has its own Dockerfile and railway.toml.
watchPatterns = [
  "/src/**",
  "/pom.xml",
  "/Dockerfile",
  "/railway.toml"
]

[deploy]
healthcheckPath = "/actuator/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
